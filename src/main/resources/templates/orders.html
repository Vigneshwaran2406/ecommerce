<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(title='My Orders')"></head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <main class="container mt-5 pt-5">
        <h1 class="mb-4">My Orders</h1>
        
        <!-- No Orders -->
        <div class="card text-center py-5" th:if="${orders.empty}">
            <div class="card-body">
                <i class="bi bi-box text-muted" style="font-size: 4rem;"></i>
                <h3 class="mt-3">No orders yet</h3>
                <p class="text-muted">You haven't placed any orders yet.</p>
                <a th:href="@{/products}" class="btn btn-primary mt-3">Start Shopping</a>
            </div>
        </div>
        
        <!-- Orders List -->
        <div class="table-responsive" th:if="${!orders.empty}">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Order #</th>
                        <th scope="col">Date</th>
                        <th scope="col">Items</th>
                        <th scope="col">Total</th>
                        <th scope="col">Status</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${'#' + order.id}">Order #</td>
                        <td th:text="${#temporals.format(order.orderDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                        <td th:text="${order.orderItems.size()}">Items</td>
                        <td th:text="${'$' + order.totalAmount}">$99.99</td>
                        <td>
                            <span class="badge bg-warning text-dark" th:if="${order.status.name() == 'PENDING'}">Pending</span>
                            <span class="badge bg-info text-dark" th:if="${order.status.name() == 'PROCESSING'}">Processing</span>
                            <span class="badge bg-primary" th:if="${order.status.name() == 'SHIPPED'}">Shipped</span>
                            <span class="badge bg-success" th:if="${order.status.name() == 'DELIVERED'}">Delivered</span>
                            <span class="badge bg-danger" th:if="${order.status.name() == 'CANCELLED'}">Cancelled</span>
                        </td>
                        <td>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                View Details
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
