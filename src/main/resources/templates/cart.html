<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(title='Shopping Cart')"></head>
<body>
    <header th:replace="fragments/layout :: header"></header>
    
    <main class="container mt-5 pt-5">
        <h1 class="mb-4">Your Shopping Cart</h1>
        
        <div class="row">
            <div class="col-lg-8">
                <!-- Empty Cart -->
                <div class="card mb-4 text-center py-5" th:if="${cart.cartItems.empty}">
                    <div class="card-body">
                        <i class="bi bi-cart text-muted" style="font-size: 4rem;"></i>
                        <h3 class="mt-3">Your cart is empty</h3>
                        <p class="text-muted">Looks like you haven't added any products to your cart yet.</p>
                        <a th:href="@{/products}" class="btn btn-primary mt-3">Continue Shopping</a>
                    </div>
                </div>
                
                <!-- Cart Items -->
                <div class="card mb-4" th:if="${!cart.cartItems.empty}">
                    <div class="card-header">
                        <h5 class="mb-0">Cart Items (<span th:text="${cart.totalItems}">0</span>)</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col" colspan="2">Product</th>
                                        <th scope="col">Price</th>
                                        <th scope="col">Quantity</th>
                                        <th scope="col">Subtotal</th>
                                        <th scope="col"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="item : ${cart.cartItems}">
                                        <td style="width: 80px;">
                                            <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : '/images/product-placeholder.jpg'}" 
                                                 class="img-thumbnail" alt="Product Image" style="height: 80px; width: 80px; object-fit: cover;">
                                        </td>
                                        <td>
                                            <h6 class="mb-0">
                                                <a th:href="@{/products/{id}(id=${item.product.id})}" 
                                                   class="text-decoration-none" th:text="${item.product.name}">
                                                    Product Name
                                                </a>
                                            </h6>
                                            <small class="text-muted" th:if="${item.product.category != null}" th:text="${item.product.category.name}">
                                                Category
                                            </small>
                                        </td>
                                        <td th:text="${'$' + item.product.price}">$99.99</td>
                                        <td>
                                            <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center">
                                                <input type="hidden" name="productId" th:value="${item.product.id}">
                                                <input type="number" class="form-control form-control-sm me-2" name="quantity" 
                                                      th:value="${item.quantity}" min="1" th:max="${item.product.stockQuantity}" 
                                                      style="width: 60px;" onchange="this.form.submit()">
                                            </form>
                                        </td>
                                        <td class="fw-bold" th:text="${'$' + item.subtotal}">$199.98</td>
                                        <td>
                                            <form th:action="@{/cart/remove}" method="post">
                                                <input type="hidden" name="productId" th:value="${item.product.id}">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer d-flex justify-content-between align-items-center">
                        <a th:href="@{/products}" class="btn btn-outline-primary">
                            <i class="bi bi-arrow-left"></i> Continue Shopping
                        </a>
                        <form th:action="@{/cart/clear}" method="post">
                            <button type="submit" class="btn btn-outline-danger">
                                <i class="bi bi-trash"></i> Clear Cart
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal</span>
                            <span class="fw-bold" th:text="${'$' + cart.totalAmount}">$0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Shipping</span>
                            <span class="fw-bold">Free</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between mb-4">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold text-primary" th:text="${'$' + cart.totalAmount}">$0.00</span>
                        </div>
                        
                        <a th:href="@{/checkout}" class="btn btn-primary w-100" th:classappend="${cart.cartItems.empty ? 'disabled' : ''}">
                            Proceed to Checkout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer th:replace="fragments/layout :: footer"></footer>
</body>
</html>
