<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head(title='Product Details')"></head>
<body>
<header th:replace="fragments/layout :: header"></header>

<main class="container mt-5 pt-5">
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products}">Products</a></li>
            <li class="breadcrumb-item" th:if="${product.category != null}">
                <a th:href="@{/products(categoryId=${product.category.id})}" th:text="${product.category.name}">Category</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Product Name</li>
        </ol>
    </nav>

    <div class="row">
        <!-- Product Image -->
        <div class="col-md-5 mb-4">
            <div class="product-image-container bg-white rounded shadow-sm p-3">
                <img th:src="${product.imageUrl != null ? product.imageUrl : '/images/product-placeholder.jpg'}"
                     class="product-detail-image img-fluid" alt="Product Image">
            </div>
        </div>

        <!-- Product Details -->
        <div class="col-md-7">
            <h1 class="mb-3" th:text="${product.name}">Product Name</h1>

            <div class="mb-3">
                <span class="badge bg-success" th:if="${product.stockQuantity > 10}">In Stock</span>
                <span class="badge bg-warning text-dark" th:if="${product.stockQuantity > 0 && product.stockQuantity <= 10}">
                        Only <span th:text="${product.stockQuantity}"></span> left
                    </span>
                <span class="badge bg-danger" th:if="${product.stockQuantity == 0}">Out of Stock</span>
            </div>

            <h3 class="text-primary fw-bold mb-4" th:text="${'$' + product.price}">$99.99</h3>

            <div class="mb-4" th:if="${product.category != null}">
                <span class="text-muted">Category: </span>
                <a th:href="@{/products(categoryId=${product.category.id})}" th:text="${product.category.name}">Category</a>
            </div>

            <div class="mb-4">
                <h5>Description</h5>
                <p class="text-muted" th:text="${product.description}">Description goes here...</p>
            </div>

            <form th:action="@{/cart/add}" method="post" class="mb-4" sec:authorize="isAuthenticated()" th:if="${product.stockQuantity > 0}">
                <input type="hidden" name="productId" th:value="${product.id}">

                <div class="row g-3 align-items-center mb-3">
                    <div class="col-auto">
                        <label for="quantity" class="form-label">Quantity:</label>
                    </div>
                    <div class="col-auto">
                        <input type="number" class="form-control" id="quantity" name="quantity" min="1"
                               th:max="${product.stockQuantity}" value="1" style="width: 70px;">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="bi bi-cart-plus"></i> Add to Cart
                </button>
            </form>

            <a th:href="@{/login}" class="btn btn-primary btn-lg mb-4" sec:authorize="!isAuthenticated()" th:if="${product.stockQuantity > 0}">
                <i class="bi bi-cart-plus"></i> Add to Cart
            </a>

            <button class="btn btn-secondary btn-lg mb-4" disabled th:if="${product.stockQuantity == 0}">
                Out of Stock
            </button>
        </div>
    </div>

    <!-- Related Products -->
    <section class="mt-5">
        <h3 class="mb-4">Related Products</h3>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="relatedProduct : ${relatedProducts}" th:if="${relatedProduct.id != product.id}">
                <div class="card h-100 product-card">
                    <div class="card-img-container">
                        <img th:src="${relatedProduct.imageUrl != null ? relatedProduct.imageUrl : '/images/product-placeholder.jpg'}"
                             class="card-img-top" alt="Product Image">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title" th:text="${relatedProduct.name}">Product Name</h5>
                        <p class="card-text text-primary fw-bold" th:text="${'$' + relatedProduct.price}">$99.99</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <a th:href="@{/products/{id}(id=${relatedProduct.id})}" class="btn btn-sm btn-outline-primary">View Details</a>
                            <form th:action="@{/cart/add}" method="post" sec:authorize="isAuthenticated()" th:if="${relatedProduct.stockQuantity > 0}">
                                <input type="hidden" name="productId" th:value="${relatedProduct.id}">
                                <input type="hidden" name="quantity" value="1">
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i class="bi bi-cart-plus"></i> Add
                                </button>
                            </form>
                            <a th:href="@{/login}" class="btn btn-sm btn-primary" sec:authorize="!isAuthenticated()" th:if="${relatedProduct.stockQuantity > 0}">
                                <i class="bi bi-cart-plus"></i> Add
                            </a>
                            <button class="btn btn-sm btn-secondary" disabled th:if="${relatedProduct.stockQuantity == 0}">
                                Out of Stock
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer th:replace="fragments/layout :: footer"></footer>

<style>
    .product-image-container {
        width: 100%;
        min-height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .product-detail-image {
        max-width: 100%;
        max-height: 400px;
        object-fit: contain;
    }
</style>
</body>
</html>
